name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site/posts
          mkdir -p _site/logo_para_colocar_nas_imagens_geradas/logo_adp
          mkdir -p _site/logo_para_colocar_nas_imagens_geradas/logo_polisat
          cp index.html _site/index.html
          cp posts/exemplo-mes-doar.png _site/posts/exemplo-mes-doar.png
          cp posts/exemplo-impacto-projetos.png _site/posts/exemplo-impacto-projetos.png
          cp logo_para_colocar_nas_imagens_geradas/logo_adp/logo-amigos-da-poli.svg _site/logo_para_colocar_nas_imagens_geradas/logo_adp/logo-amigos-da-poli.svg
          cp logo_para_colocar_nas_imagens_geradas/logo_polisat/logo_branco_svg.svg _site/logo_para_colocar_nas_imagens_geradas/logo_polisat/logo_branco_svg.svg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
